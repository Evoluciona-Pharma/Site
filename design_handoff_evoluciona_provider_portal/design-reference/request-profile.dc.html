<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = {
    filterCat: null,
    drawerOpen: false,
    qv: null,
    list: [
      { name: "NAD+", dose: "5 mL", cat: "Longevity & Cellular Health" },
      { name: "Sermorelin", dose: "5 mL", cat: "Hormone Optimization" }
    ]
  };
  componentDidMount() {
    this._catSync = () => { const mm = (location.hash || '').match(/(?:^|[#|&])cat=([^|&]*)/); const v = mm && mm[1] ? decodeURIComponent(mm[1].split(',')[0]) : null; if (v !== this.state.filterCat) this.setState({ filterCat: v }); };
    window.addEventListener('hashchange', this._catSync);
    this._catSync();
    const els = Array.from(document.querySelectorAll('[data-reveal]'));
    els.forEach(el => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(26px)';
      el.style.transition = 'opacity 0.7s ease, transform 0.7s ease';
      el.style.transitionDelay = (el.getAttribute('data-reveal') || '0') + 'ms';
    });
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          en.target.style.opacity = '1';
          en.target.style.transform = 'translateY(0)';
          io.unobserve(en.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -8% 0px' });
    els.forEach(el => io.observe(el));
    // Failsafe: scroll-reveal hides content at mount. If the observer never fires
    // (odd viewport, zoomed canvas, offscreen mount) the page would stay blank forever.
    setTimeout(() => els.forEach(el => { if (el.style.opacity !== '1') { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; } }), 2000);
    const cts = Array.from(document.querySelectorAll('[data-count]'));
    const io2 = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (!en.isIntersecting) return;
        const el = en.target;
        io2.unobserve(el);
        const target = parseFloat(el.getAttribute('data-count'));
        const t0 = performance.now(), dur = 1100;
        const step = (t) => {
          const k = Math.min(1, (t - t0) / dur);
          el.textContent = String(Math.round(target * (1 - Math.pow(1 - k, 3))));
          if (k < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    }, { threshold: 0.4 });
    cts.forEach(el => io2.observe(el));
    this._ios = [io, io2];
  }
  componentWillUnmount() {
    (this._ios || []).forEach(io => io.disconnect());
    window.removeEventListener('hashchange', this._catSync);
  }
  setCat(label) {
    const scr = (location.hash || '').replace('#', '').split('|')[0];
    const frag = label ? 'cat=' + encodeURIComponent(label) : '';
    const isRoute = /^[a-z0-9-]+$/i.test(scr) && scr.indexOf('=') === -1;
    const next = [isRoute ? scr : '', frag].filter(Boolean).join('|'); if (next) { if (location.hash !== '#' + next) location.hash = next; } else if (location.hash && location.hash !== '#') location.hash = '';
    this.setState({ filterCat: label });
  }
  addItem(p) {
    this.setState(s => ({
      drawerOpen: true,
      qv: null,
      list: s.list.some(i => i.name === p.name) ? s.list : [...s.list, { name: p.name, dose: p.doseDefault, cat: p.cat }]
    }));
  }
  removeItem(name) {
    this.setState(s => ({ list: s.list.filter(i => i.name !== name) }));
  }
  renderVals() {
    const showBadges = this.props.showBadges ?? true;
    const base = [
      { name: "NAD+", slug: "nad", cat: "Longevity & Cellular Health", badge: "Featured", doseDefault: "5 mL", dose2: "10 mL", format: "Sterile vial", presentation: "5 mL, 10 mL", concentration: "100 mg/mL", spec: "Sterile vial · 5 mL and 10 mL · 100 mg/mL", blurb: "Coenzyme involved in redox reactions, cellular metabolism, mitochondrial electron transport, and cellular signaling pathways." },
      { name: "NAD+ / Glutathione", slug: "nad-glutathione", cat: "Longevity & Cellular Health", badge: "New", doseDefault: "10 mL", dose2: "", format: "Sterile vial", presentation: "10 mL", concentration: "Pending confirmation", spec: "Sterile vial · combination formulation · 10 mL", blurb: "Combination sterile compounded formulation pairing NAD+ with glutathione." },
      { name: "MOTS-C", slug: "mots-c", cat: "Longevity & Cellular Health", badge: "", doseDefault: "TBC", dose2: "", format: "Sterile vial", presentation: "Pending confirmation", concentration: "Pending confirmation", spec: "Sterile vial · presentation pending confirmation", blurb: "Mitochondrial-derived peptide. Presentation conflicts between source documents — pharmacy confirmation required." },
      { name: "BPC-157", slug: "bpc-157", cat: "Recovery & Regenerative", badge: "", doseDefault: "5 mL", dose2: "", format: "Sterile vial", presentation: "5 mL", concentration: "Pending confirmation", spec: "Sterile vial · 5 mL", blurb: "Synthetic peptide sequence studied in tissue and connective structure contexts." },
      { name: "TB-500", slug: "tb-500", cat: "Recovery & Regenerative", badge: "", doseDefault: "5 mL", dose2: "", format: "Sterile vial", presentation: "5 mL", concentration: "Pending confirmation", spec: "Sterile vial · 5 mL", blurb: "Synthetic peptide fragment related to thymosin beta-4." },
      { name: "Sermorelin", slug: "sermorelin", cat: "Hormone Optimization", badge: "", doseDefault: "5 mL", dose2: "", format: "Sterile vial", presentation: "5 mL", concentration: "Pending confirmation", spec: "Sterile vial · 5 mL", blurb: "Growth hormone-releasing hormone analog compounded as a sterile preparation." },
      { name: "Lipo-C", slug: "lipo-c", cat: "Nutrient & Metabolic", cat2: "Metabolic Health", badge: "", doseDefault: "10 mL", dose2: "", format: "Sterile vial", presentation: "10 mL", concentration: "Data fix pending", spec: "Sterile vial · 10 mL", blurb: "Lipotropic nutrient combination. Concentration value in the source data awaits pharmacy correction." },
      { name: "PT-141", slug: "pt-141", cat: "Sexual Wellness", badge: "", doseDefault: "5 mL", dose2: "", format: "Sterile vial", presentation: "5 mL", concentration: "Pending confirmation", spec: "Sterile vial · 5 mL", blurb: "Melanocortin receptor agonist peptide compounded as a sterile preparation." }
    ];
    const products = base.map(p => ({
      ...p,
      badgeShown: showBadges ? p.badge : "",
      add: () => this.addItem(p),
      quick: () => this.setState({ qv: p })
    }));
    const fc = this.state.filterCat;
    const shopProducts = fc ? products.filter(pp => pp.cat === fc || pp.cat2 === fc) : products;
    const chipBase = { height: '38px', display: 'inline-flex', alignItems: 'center', padding: '0 18px', borderRadius: '100px', fontSize: '13px', fontWeight: 600, cursor: 'pointer', transition: 'all 0.2s ease' };
    const catList = [
      { label: "Longevity & Cellular Health", count: "3" },
      { label: "Recovery & Regenerative", count: "2" },
      { label: "Hormone Optimization", count: "1" },
      { label: "Nutrient & Metabolic", count: "1" },
      { label: "Metabolic Health", count: "1" },
      { label: "Sexual Wellness", count: "1" }
    ].map(c => ({ ...c, pick: () => this.setCat(c.label), shopHref: 'shop.dc.html#cat=' + encodeURIComponent(c.label), chipStyle: (fc === c.label) ? { ...chipBase, background: '#14258F', color: '#ffffff' } : { ...chipBase, border: '1px solid #D9DEE5', background: '#ffffff', color: '#3C4757' } }));
    const qv = this.state.qv || {};
    return {
      products,
      shopProducts,
      shopCount: String(shopProducts.length),
      shopCountLabel: shopProducts.length + (shopProducts.length === 1 ? ' product' : ' products'),
      pickAll: () => this.setCat(null),
      allChipStyle: fc ? { ...chipBase, border: '1px solid #D9DEE5', background: '#ffffff', color: '#3C4757' } : { ...chipBase, background: '#14258F', color: '#ffffff' },
      featured: products.slice(0, 4),
      categories: catList,
      related: [
        { name: "NAD+ / Glutathione", spec: "Longevity & Cellular Health · Sterile vial" },
        { name: "MOTS-C", spec: "Longevity & Cellular Health · Sterile vial" },
        { name: "Sermorelin", spec: "Hormone Optimization · Sterile vial" },
        { name: "BPC-157", spec: "Recovery & Regenerative · Sterile vial" }
      ],
      providerFaqs: [
        { q: "How do I become a verified provider?" },
        { q: "What documentation does verification require?" },
        { q: "How is a patient-specific prescription submitted?" },
        { q: "What are typical preparation and shipping timelines?" },
        { q: "Who do I contact about a formulation question?" }
      ],
      blockers: [
        { tag: "BLOCKER", text: "Image assets & art direction not provided [Client / Zenga] — every product shot and the hero are striped placeholders until approved imagery lands." },
        { tag: "DECISION", text: "Badges (“Featured”, “New”) are merchandising-neutral; confirm allowed wording with compliance before launch." },
        { tag: "DATA FIX", text: "Lipo-C concentration is mislabeled and MOTS-C presentation conflicts — both render as pending, blank-safe." },
        { tag: "CONFIRM", text: "Request-list drawer replaces the cart; final submit still routes through the 4-step form with the list attached." }
      ],
      showStickyBar: this.props.showStickyBar ?? true,
      drawerOpen: this.state.drawerOpen,
      qvOpen: !!this.state.qv,
      qv,
      qvAdd: () => { if (this.state.qv) this.addItem(this.state.qv); },
      listCount: String(this.state.list.length),
      list: this.state.list.map(it => ({ ...it, remove: () => this.removeItem(it.name) })),
      openDrawer: () => this.setState({ drawerOpen: true }),
      closeDrawer: () => this.setState({ drawerOpen: false }),
      closeQuick: () => this.setState({ qv: null })
    };
  }
}
</script>
