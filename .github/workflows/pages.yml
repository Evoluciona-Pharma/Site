name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build:pages
        env:
          # The site is served from https://<org>.github.io/Site/
          NEXT_PUBLIC_BASE_PATH: /Site

      # Without this, Pages' Jekyll step drops the _next/ directory.
      - run: touch out/.nojekyll

      # enablement lets the first run turn Pages on itself, rather than
      # failing until someone flips it in repo settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # deploy-pages polls until the deployment reports live and aborts at its
      # 10-minute default. Pushing again while a deploy is still settling has
      # pushed it past that, failing a run whose build was fine — so allow longer
      # and retry once rather than leaving main un-deployed.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 900000

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
